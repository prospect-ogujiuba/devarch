x-devarch:
  title: PHP-FPM
  description: Shared PHP runtime with Composer, WP-CLI, and Laravel installer for apps/
  tags: [runtime, php, wordpress, laravel]
  version:
    var: PHP_VERSION
    default: "8.4"
    choices: ["8.4", "8.3", "8.2"]
    rebuild: true
services:
  php:
    build:
      context: ../php/config
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    ports:
      - "127.0.0.1:8100:8000"
      - "127.0.0.1:8080:8080"
    working_dir: /var/www/html
    volumes:
      - ${DEVARCH_APPS_DIR:-../../../apps}:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - microservices-net
    container_name: php

networks:
  microservices-net:
    external: true
    name: ${DEVARCH_NETWORK:-microservices-net}
