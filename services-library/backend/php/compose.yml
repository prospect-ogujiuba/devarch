services:
  php:
    build:
      context: ../php/config
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8100:8000"
      - "127.0.0.1:8080:8080"
    working_dir: /var/www/html
    volumes:
      - ../../../apps:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - microservices-net
    container_name: php

networks:
  microservices-net:
    external: true
