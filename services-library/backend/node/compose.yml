services:
  node:
    build:
      context: ./config
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8205:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEVARCH_NODE_TARGET_PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/__devarch/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - microservices-net
    container_name: node

networks:
  microservices-net:
    external: true
