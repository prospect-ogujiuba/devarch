services:
  minio:
    # MinIO no longer publishes images; pgsty/minio is the community build
    # upstream Plane uses. It reads existing MinIO data unchanged.
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    ports:
    - 127.0.0.1:9500:9000
    - 127.0.0.1:9501:9001
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: devarch123
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || curl -f http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - microservices-net
    container_name: minio
volumes:
  minio_data: null
networks:
  microservices-net:
    external: true
    name: ${DEVARCH_NETWORK:-microservices-net}
