services:
  chromadb:
    # Chroma 1.x (Rust) persists to /data via the image's /config.yaml and
    # ships no curl, so the healthcheck speaks HTTP through bash.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    ports:
    - 127.0.0.1:8901:8000
    volumes:
    - chromadb_data:/data
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - microservices-net
    container_name: chromadb
volumes:
  chromadb_data: null
networks:
  microservices-net:
    external: true
    name: ${DEVARCH_NETWORK:-microservices-net}
