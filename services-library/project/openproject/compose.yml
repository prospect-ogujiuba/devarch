services:
  openproject-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:5433:5432
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OPENPROJECT_DB_PASSWORD:?Set OPENPROJECT_DB_PASSWORD in .env}
    volumes:
      - openproject-db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openproject -d openproject]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - openproject-internal
    container_name: openproject-db

  openproject:
    image: openproject/openproject:17.8.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:9214:80
    environment:
      DATABASE_URL: postgres://openproject:${OPENPROJECT_DB_PASSWORD:?Set OPENPROJECT_DB_PASSWORD in .env}@openproject-db:5432/openproject
      OPENPROJECT_HOST__NAME: openproject.test
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_HSTS: "false"
      OPENPROJECT_EE__MANAGER__VISIBLE: "false"
      OPENPROJECT_EE__HIDE__BANNERS: "true"
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?Set OPENPROJECT_SECRET_KEY_BASE in .env}
      OPENPROJECT_SEED__ADMIN__USER__LOGIN: ${OPENPROJECT_ADMIN_LOGIN:-admin}
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD: ${OPENPROJECT_ADMIN_PASSWORD:?Set OPENPROJECT_ADMIN_PASSWORD in .env}
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: "false"
      OPENPROJECT_SEED__ADMIN__USER__MAIL: ${OPENPROJECT_ADMIN_EMAIL:-admin@devarch.test}
    volumes:
      - openproject-assets:/var/openproject/assets
    depends_on:
      openproject-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost/health_checks/default || exit 1]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      openproject-internal: null
      microservices-net:
        aliases:
          - openproject
    container_name: openproject

volumes:
  openproject-db-data-v2: null
  openproject-assets: null

networks:
  openproject-internal: null
  microservices-net:
    external: true
