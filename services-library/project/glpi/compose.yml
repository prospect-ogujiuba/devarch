services:
  glpi-db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - 127.0.0.1:3307:3306
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?Set GLPI_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?Set GLPI_DB_ROOT_PASSWORD in .env}
    volumes:
      - glpi-db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - glpi-internal
    container_name: glpi-db

  glpi:
    image: glpi/glpi:11.0.9
    restart: unless-stopped
    ports:
      - 127.0.0.1:9216:80
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?Set GLPI_DB_PASSWORD in .env}
    volumes:
      - glpi-data:/var/glpi
    depends_on:
      glpi-db:
        condition: service_healthy
    networks:
      glpi-internal: null
      microservices-net:
        aliases:
          - glpi
    container_name: glpi

volumes:
  glpi-db-data: null
  glpi-data: null

networks:
  glpi-internal: null
  microservices-net:
    external: true
