x-back-environment: &back-environment
  POSTGRES_DB: taiga
  POSTGRES_USER: taiga
  POSTGRES_PASSWORD: devarch-taiga-db
  POSTGRES_HOST: taiga-db
  TAIGA_SECRET_KEY: local-devarch-taiga-comparison-secret-key
  TAIGA_SITES_SCHEME: https
  TAIGA_SITES_DOMAIN: taiga.test
  TAIGA_SUBPATH: ""
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  DEFAULT_FROM_EMAIL: admin@devarch.test
  EMAIL_USE_TLS: "True"
  EMAIL_USE_SSL: "False"
  EMAIL_HOST: smtp.host.example.com
  EMAIL_PORT: "587"
  EMAIL_HOST_USER: user
  EMAIL_HOST_PASSWORD: password
  RABBITMQ_USER: taiga
  RABBITMQ_PASS: devarch-taiga-rabbit
  ENABLE_TELEMETRY: "False"

x-back-volumes: &back-volumes
  - taiga-static-data:/taiga-back/static
  - taiga-media-data:/taiga-back/media

services:
  taiga-db:
    image: postgres:12.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: devarch-taiga-db
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U taiga]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 5s
    networks:
      - microservices-net
    container_name: taiga-db

  taiga-back:
    image: taigaio/taiga-back:latest
    restart: unless-stopped
    environment: *back-environment
    volumes: *back-volumes
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
    networks:
      - microservices-net
    container_name: taiga-back

  taiga-async:
    image: taigaio/taiga-back:latest
    restart: unless-stopped
    entrypoint: [/taiga-back/docker/async_entrypoint.sh]
    environment: *back-environment
    volumes: *back-volumes
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
    networks:
      - microservices-net
    container_name: taiga-async

  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    restart: unless-stopped
    hostname: taiga-async-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: local-devarch-taiga-erlang-cookie
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: devarch-taiga-rabbit
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
      - taiga-async-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservices-net
    container_name: taiga-async-rabbitmq

  taiga-front:
    image: taigaio/taiga-front:latest
    restart: unless-stopped
    environment:
      TAIGA_URL: https://taiga.test
      TAIGA_WEBSOCKETS_URL: wss://taiga.test
      TAIGA_SUBPATH: ""
    networks:
      - microservices-net
    container_name: taiga-front

  taiga-events:
    image: taigaio/taiga-events:latest
    restart: unless-stopped
    environment:
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: devarch-taiga-rabbit
      TAIGA_SECRET_KEY: local-devarch-taiga-comparison-secret-key
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started
    networks:
      - microservices-net
    container_name: taiga-events

  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    restart: unless-stopped
    hostname: taiga-events-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: local-devarch-taiga-erlang-cookie
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: devarch-taiga-rabbit
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
      - taiga-events-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservices-net
    container_name: taiga-events-rabbitmq

  taiga-protected:
    image: taigaio/taiga-protected:latest
    restart: unless-stopped
    environment:
      MAX_AGE: "360"
      SECRET_KEY: local-devarch-taiga-comparison-secret-key
    networks:
      - microservices-net
    container_name: taiga-protected

  taiga:
    image: nginx:1.19-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:9212:80
    volumes:
      - ./config/taiga.conf:/etc/nginx/conf.d/default.conf:ro
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost/ || exit 1]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - microservices-net
    container_name: taiga

volumes:
  taiga-static-data: null
  taiga-media-data: null
  taiga-db-data: null
  taiga-async-rabbitmq-data: null
  taiga-events-rabbitmq-data: null
networks:
  microservices-net:
    external: true
