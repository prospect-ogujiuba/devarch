x-devarch:
  title: Redis
  description: In-memory cache and key-value store (password devarch)
  tags: [database, cache, key-value]
  urls:
    - https://redis.test
  version:
    var: REDIS_VERSION
    default: "8.6"
    choices: ["8.6", "8.4", "8.2", "7.4"]
    data: upgrade-only
services:
  redis:
    image: redis:${REDIS_VERSION:-8.6}-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:8504:6379
    command: redis-server --requirepass devarch
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - devarch
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - microservices-net
    container_name: redis
volumes:
  redis_data: null
networks:
  microservices-net:
    external: true
    name: ${DEVARCH_NETWORK:-microservices-net}
