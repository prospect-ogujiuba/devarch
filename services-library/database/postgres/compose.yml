x-devarch:
  title: PostgreSQL
  description: Relational database
  tags: [database, sql]
  version:
    var: POSTGRES_VERSION
    default: "18.2"
    choices: ["18.2", "17", "16", "15"]
    data: same-major
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.2}
    restart: unless-stopped
    ports:
    - 127.0.0.1:8502:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devarch
      POSTGRES_DB: devarch
    volumes:
    - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - microservices-net
    container_name: postgres
volumes:
  postgres_data: null
networks:
  microservices-net:
    external: true
