x-devarch:
  title: MariaDB
  description: Shared MySQL-compatible database for WordPress and Laravel apps
  tags: [database, sql, mysql]
  version:
    var: MARIADB_VERSION
    default: "12.3"
    choices: ["12.3", "11.8", "11.4", "10.11"]
    data: upgrade-only
services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-12.3}
    restart: unless-stopped
    ports:
    - 127.0.0.1:8501:3306
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-devarch}
      MARIADB_DATABASE: devarch
    volumes:
    - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
    - microservices-net
    container_name: mariadb
volumes:
  mariadb_data: null
networks:
  microservices-net:
    external: true
    name: ${DEVARCH_NETWORK:-microservices-net}
