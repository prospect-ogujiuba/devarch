services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    ports:
    - 127.0.0.1:81:81
    - 127.0.0.1:80:80
    - 127.0.0.1:443:443
    volumes:
    - npm_data:/data
    - npm_letsencrypt:/etc/letsencrypt
    - ../../../apps:/var/www/html:ro
    - ./config/custom/events.conf:/data/nginx/custom/events.conf
    - ./config/custom/http.conf:/data/nginx/custom/http.conf
    - ./config/custom/http_top.conf:/data/nginx/custom/http_top.conf
    - ./config/custom/root_top.conf:/data/nginx/custom/root_top.conf
    - ./config/custom/server_proxy.conf:/data/nginx/custom/server_proxy.conf
    - ./config/certs/local.crt:/etc/ssl/certs/local.crt:ro
    - ./config/certs/local.key:/etc/ssl/private/local.key:ro
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:81/api/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - microservices-net
    container_name: nginx-proxy-manager
volumes:
  npm_data: null
  npm_letsencrypt: null
networks:
  microservices-net:
    external: true
