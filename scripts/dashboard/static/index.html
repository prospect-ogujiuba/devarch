<!doctype html>
<html lang="en" class="h-full bg-ink-950">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Discover and open local DevArch apps, containers, and services.">
    <title>DevArch Home</title>
    <link rel="stylesheet" href="/dashboard.css">
    <script src="/dashboard.js" defer></script>
  </head>
  <body class="min-h-full text-slate-200 antialiased selection:bg-teal-300 selection:text-slate-950">
    <header class="sticky top-0 z-40 border-b border-white/10 bg-ink-950/90 backdrop-blur-xl">
      <div class="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">
        <a href="/" data-route class="flex shrink-0 items-center gap-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400/60">
          <span class="grid size-9 place-items-center rounded-xl bg-teal-400 font-black text-slate-950 shadow-lg shadow-teal-400/20">D</span>
          <span class="hidden text-sm font-bold uppercase tracking-[0.18em] text-teal-200 sm:block">DevArch</span>
        </a>

        <nav class="hidden items-center gap-1 md:flex" aria-label="Primary navigation">
          <a href="/" data-route data-nav="home" class="nav-link">Dashboard</a>
          <a href="/apps" data-route data-nav="apps" class="nav-link">Apps</a>
          <a href="/containers" data-route data-nav="containers" class="nav-link">Containers</a>
          <a href="/services" data-route data-nav="services" class="nav-link">Services</a>
        </nav>

        <div class="ml-auto flex items-center gap-2">
          <span id="refresh-status" class="hidden text-xs text-slate-500 lg:block" aria-live="polite">Loading inventory…</span>
          <button id="refresh-button" class="primary-action px-3 sm:px-4" type="button">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 6.5L4 11m16 2-2 4.5A7 7 0 0 1 5.5 15"/></svg>
            <span class="hidden sm:inline">Refresh</span>
          </button>
          <button id="menu-button" class="action size-10 p-0 md:hidden" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open navigation menu">
            <svg id="menu-open-icon" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <svg id="menu-close-icon" class="hidden size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>

      <nav id="mobile-menu" class="hidden border-t border-white/10 px-4 py-3 md:hidden" aria-label="Mobile navigation">
        <div class="mx-auto grid max-w-7xl gap-1">
          <a href="/" data-route data-nav="home" class="mobile-nav-link">Dashboard</a>
          <a href="/apps" data-route data-nav="apps" class="mobile-nav-link">Apps</a>
          <a href="/containers" data-route data-nav="containers" class="mobile-nav-link">Containers</a>
          <a href="/services" data-route data-nav="services" class="mobile-nav-link">Services</a>
        </div>
      </nav>
    </header>

    <main class="mx-auto min-h-[calc(100vh-4rem)] max-w-7xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
      <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="min-w-0">
          <p id="page-eyebrow" class="text-xs font-bold uppercase tracking-[0.2em] text-teal-300">Local workspace</p>
          <h1 id="page-title" class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">Dashboard</h1>
          <p id="page-description" class="mt-3 max-w-2xl text-sm leading-6 text-slate-400">Your apps, containers, and services at a glance.</p>
        </div>
        <a id="page-back" href="/" data-route class="action hidden shrink-0">← Back</a>
      </div>

      <div id="search-panel" class="surface mb-8 p-3 sm:p-4">
        <label for="search" class="sr-only">Search this page</label>
        <div class="flex items-center gap-3 rounded-xl border border-white/10 bg-slate-950/70 px-4 py-3 focus-within:border-teal-400/50 focus-within:ring-2 focus-within:ring-teal-400/10">
          <svg class="size-5 shrink-0 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Search this page…" class="w-full bg-transparent text-base text-white outline-none placeholder:text-slate-600">
          <kbd class="hidden rounded border border-white/10 bg-white/5 px-2 py-1 text-xs text-slate-500 sm:block">/</kbd>
        </div>
      </div>

      <div id="runtime-alert" class="mb-8 hidden rounded-xl border border-amber-400/20 bg-amber-400/10 px-4 py-3 text-sm text-amber-200" role="status"></div>
      <div id="view" aria-live="polite">
        <div class="surface animate-pulse p-8 text-sm text-slate-500">Loading DevArch inventory…</div>
      </div>

      <footer class="mt-12 border-t border-white/10 pt-6 text-xs text-slate-600">Local inventory only · no polling · native Podman and Compose remain in control</footer>
    </main>

    <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl border border-teal-300/20 bg-slate-800 px-4 py-3 text-sm font-semibold text-teal-200 shadow-2xl" role="status" aria-live="polite"></div>
  </body>
</html>
